<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood on the Clocktower Controller</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Crimson Text', serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0f0f 50%, #0f0a1a 100%);
    color: #f0e6d2;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    transition: background 1s ease;
  }

  body.day-theme {
    background: linear-gradient(135deg, #2a4a3a 0%, #3a5f4a 50%, #4a6f5a 100%);
  }

  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 20% 80%, rgba(139, 69, 19, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(25, 25, 112, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 40% 40%, rgba(178, 34, 34, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: -1;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: 3em;
    font-weight: 600;
    background: linear-gradient(135deg, #d4af37, #8b4513);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    margin-bottom: 10px;
    letter-spacing: 3px;
  }

  .subtitle {
    font-size: 1.2em;
    color: #a08060;
    font-style: italic;
  }

  .controls-section {
    background: rgba(20, 20, 30, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.3);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .phase-controls {
    display: flex;
    gap: 30px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-group label {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.1em;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  select, input[type="number"] {
    background: rgba(40, 40, 50, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.4);
    border-radius: 10px;
    padding: 12px 20px;
    color: #f0e6d2;
    font-family: 'Crimson Text', serif;
    font-size: 1.1em;
    transition: all 0.3s ease;
  }

  select:focus, input[type="number"]:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
  }

  select option {
    background: #1a0f0f;
    color: #f0e6d2;
  }

  .players-section {
    background: rgba(20, 20, 30, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.3);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1.8em;
    font-weight: 600;
    color: #d4af37;
    margin-bottom: 25px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .player-card {
    background: rgba(30, 30, 40, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.4);
    border-radius: 15px;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .player-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #d4af37, #8b4513);
  }

  .player-card.dead {
    background: rgba(40, 20, 20, 0.8);
    border-color: rgba(178, 34, 34, 0.4);
    opacity: 0.8;
  }

  .player-card.dead::before {
    background: linear-gradient(90deg, #dc143c, #8b0000);
  }

  .player-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 48px rgba(139, 69, 19, 0.2);
  }

  .player-card.selected {
    border-color: #d4af37;
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
  }

  .player-card.dragging {
    opacity: 0.4;
  }

  .player-card.drag-over {
    border-color: #90ee90;
    box-shadow: 0 0 20px rgba(144, 238, 144, 0.4);
  }

  .drag-handle {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #a08060;
    font-size: 1.2em;
    cursor: grab;
    user-select: none;
  }

  .drag-handle:active {
    cursor: grabbing;
  }

  .select-hint {
    font-size: 0.85em;
    color: #a08060;
    font-style: italic;
  }

  .status-badge.executed {
    background: rgba(255, 140, 0, 0.2);
    border-color: rgba(255, 140, 0, 0.5);
    color: #ff8c00;
  }

  .status-badge.killed {
    background: rgba(178, 34, 34, 0.25);
    border-color: rgba(178, 34, 34, 0.5);
    color: #ff6b6b;
  }

  .status-badge.nominator {
    background: rgba(0, 191, 255, 0.2);
    border-color: rgba(0, 191, 255, 0.4);
    color: #00bfff;
  }

  .status-badge.nominee {
    background: rgba(255, 107, 107, 0.2);
    border-color: rgba(255, 107, 107, 0.4);
    color: #ff6b6b;
  }

  .nominate-panel {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(139, 69, 19, 0.3);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .nominate-panel label {
    font-family: 'Cinzel', serif;
    color: #00bfff;
    font-size: 0.9em;
  }

  .nominate-panel select {
    width: 100%;
  }

  .nominate-panel-buttons {
    display: flex;
    gap: 8px;
  }

  .order-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .order-btn {
    background: rgba(212, 175, 55, 0.2);
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 5px;
    color: #d4af37;
    font-size: 1.2em;
    width: 30px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 0;
  }

  .order-btn:hover {
    background: rgba(212, 175, 55, 0.3);
    border-color: #d4af37;
  }

  .order-btn:active {
    transform: scale(0.95);
  }

  .order-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .player-name {
    font-size: 1.4em;
    font-weight: 600;
    margin-bottom: 10px;
    color: #f0e6d2;
  }

  .player-status {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .status-badge {
    background: rgba(60, 60, 70, 0.8);
    border: 1px solid rgba(139, 69, 19, 0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.9em;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-badge.alive {
    background: rgba(255, 165, 0, 0.2);
    border-color: rgba(255, 165, 0, 0.4);
    color: #ffa500;
  }

  .status-badge.dead {
    background: rgba(220, 20, 60, 0.2);
    border-color: rgba(220, 20, 60, 0.4);
    color: #dc143c;
  }

  .status-badge.traveler {
    background: rgba(65, 105, 225, 0.2);
    border-color: rgba(65, 105, 225, 0.4);
    color: #4169e1;
  }

  .status-badge.ghost {
    background: rgba(147, 112, 219, 0.2);
    border-color: rgba(147, 112, 219, 0.4);
    color: #9370db;
  }

  .player-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    background: linear-gradient(135deg, rgba(139, 69, 19, 0.8), rgba(25, 25, 112, 0.8));
    border: 2px solid rgba(212, 175, 55, 0.3);
    border-radius: 10px;
    padding: 8px 16px;
    color: #f0e6d2;
    font-family: 'Crimson Text', serif;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    border-color: #d4af37;
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn.danger {
    background: linear-gradient(135deg, rgba(178, 34, 34, 0.8), rgba(139, 0, 0, 0.8));
    border-color: rgba(220, 20, 60, 0.4);
  }

  .btn.danger:hover {
    box-shadow: 0 4px 20px rgba(220, 20, 60, 0.3);
    border-color: #dc143c;
  }

  /* Execute = town vote (orange), Kill = demon/night (red) */
  .btn.execute {
    background: linear-gradient(135deg, rgba(255, 140, 0, 0.85), rgba(200, 100, 0, 0.85));
    border-color: rgba(255, 165, 0, 0.5);
  }

  .btn.execute:hover {
    box-shadow: 0 4px 20px rgba(255, 140, 0, 0.4);
    border-color: #ff8c00;
  }

  .btn.kill {
    background: linear-gradient(135deg, rgba(178, 34, 34, 0.85), rgba(110, 0, 0, 0.85));
    border-color: rgba(220, 20, 60, 0.5);
  }

  .btn.kill:hover {
    box-shadow: 0 4px 20px rgba(220, 20, 60, 0.4);
    border-color: #dc143c;
  }

  .end-game-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 12px;
  }

  .btn.end-good {
    background: linear-gradient(135deg, rgba(255, 200, 80, 0.85), rgba(200, 150, 40, 0.85));
    border-color: rgba(255, 215, 0, 0.5);
    color: #2a2410;
    font-weight: 700;
  }
  .btn.end-good:hover {
    box-shadow: 0 4px 20px rgba(255, 200, 80, 0.4);
    border-color: #ffd700;
  }

  .btn.end-evil {
    background: linear-gradient(135deg, rgba(150, 20, 20, 0.9), rgba(80, 0, 0, 0.9));
    border-color: rgba(220, 20, 60, 0.5);
    font-weight: 700;
  }
  .btn.end-evil:hover {
    box-shadow: 0 4px 20px rgba(220, 20, 60, 0.45);
    border-color: #dc143c;
  }

  .status-badge {
    transition: all 0.2s ease;
  }

  .status-badge:hover {
    transform: translateY(-1px);
    filter: brightness(1.25);
  }

  /* Avatar token in the card header */
  .player-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .player-avatar {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.05em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.2), 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  .player-card.dead .player-avatar {
    filter: grayscale(0.7) brightness(0.65);
  }

  .player-header .player-name {
    margin-bottom: 0;
  }

  .player-pronouns {
    font-size: 0.8em;
    color: #a08060;
    font-style: italic;
    margin-top: 2px;
  }

  .add-player-section {
    background: rgba(20, 20, 30, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.3);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .bulk-import-section {
    background: rgba(25, 25, 35, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.3);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .bulk-textarea {
    background: rgba(40, 40, 50, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.4);
    border-radius: 10px;
    padding: 15px;
    color: #f0e6d2;
    font-family: 'Crimson Text', serif;
    font-size: 1.1em;
    transition: all 0.3s ease;
    width: 100%;
    min-height: 120px;
    resize: vertical;
  }

  .bulk-textarea:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
  }

  .bulk-textarea::placeholder {
    color: #a08060;
    font-style: italic;
  }

  .bulk-buttons {
    display: flex;
    gap: 15px;
    margin-top: 15px;
    justify-content: center;
  }

  .add-player-form {
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  input[type="text"] {
    background: rgba(40, 40, 50, 0.8);
    border: 2px solid rgba(139, 69, 19, 0.4);
    border-radius: 10px;
    padding: 12px 20px;
    color: #f0e6d2;
    font-family: 'Crimson Text', serif;
    font-size: 1.1em;
    transition: all 0.3s ease;
    min-width: 250px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
  }

  input[type="text"]::placeholder {
    color: #a08060;
    font-style: italic;
  }

  .btn-primary {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.8), rgba(139, 69, 19, 0.8));
    border: 2px solid rgba(212, 175, 55, 0.4);
    padding: 12px 30px;
    font-size: 1.1em;
  }

  .btn-primary:hover {
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
    border-color: #d4af37;
  }

  .connection-status {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(20, 20, 30, 0.9);
    border: 2px solid rgba(139, 69, 19, 0.4);
    border-radius: 10px;
    padding: 10px 15px;
    font-size: 0.9em;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .refresh-btn {
    background: rgba(139, 69, 19, 0.35);
    border: 1px solid rgba(212, 180, 131, 0.5);
    color: #d4b483;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.85em;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .refresh-btn:hover {
    background: rgba(139, 69, 19, 0.6);
    border-color: rgba(212, 180, 131, 0.9);
    color: #fff;
  }

  .connection-status.disconnected .refresh-btn {
    background: rgba(220, 20, 60, 0.3);
    border-color: rgba(255, 107, 107, 0.7);
    color: #ff6b6b;
    animation: refresh-pulse 1.6s ease-in-out infinite;
  }

  @keyframes refresh-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.4); }
    50%      { box-shadow: 0 0 0 5px rgba(255, 107, 107, 0); }
  }

  .connection-status.connected {
    border-color: rgba(34, 139, 34, 0.6);
    color: #90ee90;
  }

  .connection-status.disconnected {
    border-color: rgba(220, 20, 60, 0.6);
    color: #ff6b6b;
  }

  .player-card.on-block {
    border-color: #ffd700;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  .player-card.on-block::before {
    background: linear-gradient(90deg, #ffd700, #ff8c00);
  }

  .player-card.nominated {
    border-color: #ff6b6b;
    box-shadow: 0 0 20px rgba(255, 107, 107, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  .player-card.nominated::before {
    background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
  }

  .player-card.nominated .player-name {
    color: #ffffff;
  }

  .audio-controls {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(139, 69, 19, 0.3);
    text-align: center;
  }

  .audio-controls .section-title {
    font-size: 1.3em;
    margin-bottom: 15px;
  }

  .now-playing {
    margin-bottom: 15px;
    font-size: 0.95em;
    color: #d4b483;
    font-style: italic;
  }

  .now-playing.playing::before {
    content: "🎶 ";
    font-style: normal;
  }

  .audio-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .on-block-controls {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(139, 69, 19, 0.3);
  }

  .on-block-title {
    font-family: 'Cinzel', serif;
    color: #ffd700;
    font-size: 0.9em;
    margin-bottom: 8px;
  }

  .votes-input-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .votes-input-group label {
    font-size: 0.9em;
    color: #a08060;
  }

  .votes-input {
    width: 60px;
    padding: 6px 10px;
    font-size: 1em;
  }

  .vote-stepper {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .vote-step-btn {
    width: 44px;
    min-width: 44px;
    height: 44px;
    padding: 0;
    font-size: 1.5em;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vote-step-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .vote-step-value {
    min-width: 2ch;
    text-align: center;
    font-size: 1.3em;
    font-weight: 600;
    color: #ffd700;
  }

  @media (max-width: 768px) {
    h1 {
      font-size: 2em;
    }
    
    .players-grid {
      grid-template-columns: 1fr;
    }
    
    .phase-controls {
      flex-direction: column;
      gap: 20px;
    }
    
    .add-player-form {
      flex-direction: column;
      width: 100%;
    }
    
    input[type="text"] {
      width: 100%;
      min-width: unset;
    }
  }
</style>
</head>
<body>
<div class="connection-status" id="connectionStatus">
  <span id="connectionText">Connecting...</span>
  <button id="refreshBtn" class="refresh-btn" onclick="location.reload()" title="Reload to reconnect">⟳ Refresh</button>
</div>

<div class="container">
  <header>
    <h1>Storyteller's Grimoire</h1>
    <p class="subtitle">Blood on the Clocktower Controller</p>
  </header>

  <section class="controls-section">
    <section class="phase-controls">
      <h2 class="section-title">Time of Day</h2>
      <div class="phase-controls-row">
        <select id="phaseSelect">
          <option value="Night">Night</option>
          <option value="Day">Day</option>
        </select>
        <input type="number" id="phaseNumber" min="1" value="1">
        <button class="btn btn-primary" id="nextPhaseBtn">Next Time</button>
      </div>
      <div class="phase-controls-row end-game-row">
        <button class="btn end-good" id="goodWinsBtn">☀️ Good Wins</button>
        <button class="btn end-evil" id="evilWinsBtn">🩸 Evil Wins</button>
      </div>
      <div class="phase-controls-row">
        <button class="btn danger" id="newGameBtn">🔄 New Game</button>
      </div>
    </section>

    <section class="audio-controls">
      <h2 class="section-title">🎵 Sound</h2>
      <div id="nowPlaying" class="now-playing">Nothing playing</div>
      <div class="audio-buttons">
        <button class="btn" id="audioChangeBtn">🔀 Change</button>
        <button class="btn" id="audioRestartBtn">⏮ Restart</button>
        <button class="btn" id="audioFadeBtn">🔉 Fade Out</button>
        <button class="btn danger" id="audioStopBtn">⏹ Stop</button>
      </div>
    </section>

  </section>

  <section class="players-section">
    <h2 class="section-title">Players</h2>
    <div class="players-grid" id="playersContainer"></div>
  </section>

  <section class="bulk-import-section">
    <h2 class="section-title">Bulk Import Players</h2>
    <textarea class="bulk-textarea" id="bulkPlayerInput" placeholder="Enter player names, one per line or separated by commas:

John Doe
Jane Smith
Bob Johnson

Or:
John Doe, Jane Smith, Bob Johnson"></textarea>
    <div class="bulk-buttons">
      <button class="btn btn-primary" id="bulkImportBtn">Import Players</button>
      <button class="btn" id="clearBulkBtn">Clear</button>
    </div>
  </section>

  <section class="add-player-section">
    <h2 class="section-title">Add Single Player</h2>
    <div class="add-player-form">
      <input type="text" id="newPlayerName" placeholder="Enter player name...">
      <button class="btn btn-primary" id="addPlayerBtn">Add Player</button>
    </div>
  </section>
</div>

<script>
const playersContainer = document.getElementById("playersContainer");
const phaseSelect = document.getElementById("phaseSelect");
const phaseNumber = document.getElementById("phaseNumber");
const newPlayerName = document.getElementById("newPlayerName");
const addPlayerBtn = document.getElementById("addPlayerBtn");
const nextPhaseBtn = document.getElementById("nextPhaseBtn");
const connectionStatus = document.getElementById("connectionStatus");
const bulkPlayerInput = document.getElementById("bulkPlayerInput");
const bulkImportBtn = document.getElementById("bulkImportBtn");
const clearBulkBtn = document.getElementById("clearBulkBtn");

let players = [];
let state = { players: [], onBlockPlayer: null, onBlockVotes: 0, nominatedPlayer: null, nominatorPlayer: null, audioCmd: null, nowPlaying: null, gameResult: null };
let previousPhase = null;
let selectedPlayer = null;
let nominatingPlayer = null; // index of player whose nominate panel is open
let blockingPlayer = null;   // index of player whose put-on-block vote picker is open
let dragIndex = null;

// Replace with your server IP
const ws = new WebSocket('ws://YOUR_IP:8080');

// Set initial game state to Night 1
phaseSelect.value = 'Night';
phaseNumber.value = '1';

const connectionText = document.getElementById("connectionText");
function updateConnectionStatus(connected) {
  if (connected) {
    connectionText.textContent = 'Connected';
    connectionStatus.className = 'connection-status connected';
  } else {
    connectionText.textContent = 'Disconnected';
    connectionStatus.className = 'connection-status disconnected';
  }
}

ws.onopen = () => {
  console.log("WebSocket connected!");
  updateConnectionStatus(true);
};

ws.onerror = (err) => {
  console.error("WebSocket error:", err);
  updateConnectionStatus(false);
};

ws.onclose = () => {
  console.log("WebSocket closed.");
  updateConnectionStatus(false);
};

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  if (data.players) state.players = data.players;
  if (data.phase) {
    // Clear nominated and on-block when transitioning to Night
    if (previousPhase === 'Day' && data.phase === 'Night') {
      clearDayState();
    }
    state.phase = data.phase;
    phaseSelect.value = data.phase;
    previousPhase = data.phase;
  }
  if (data.phaseNumber) phaseNumber.value = data.phaseNumber;
  if (data.onBlockPlayer !== undefined) state.onBlockPlayer = data.onBlockPlayer;
  if (data.onBlockVotes !== undefined) state.onBlockVotes = data.onBlockVotes;
  if (data.nominatedPlayer !== undefined) state.nominatedPlayer = data.nominatedPlayer;
  if (data.nominatorPlayer !== undefined) state.nominatorPlayer = data.nominatorPlayer;
  if (data.nowPlaying !== undefined) { state.nowPlaying = data.nowPlaying; renderNowPlaying(); }

  renderPlayers();
};

// Show what the display is currently playing
function renderNowPlaying() {
  const el = document.getElementById('nowPlaying');
  if (!el) return;
  if (state.nowPlaying) {
    el.textContent = state.nowPlaying;
    el.classList.add('playing');
  } else {
    el.textContent = 'Nothing playing';
    el.classList.remove('playing');
  }
}

function sendUpdate() {
  const data = {
    players: state.players,
    phase: phaseSelect.value,
    phaseNumber: Number(phaseNumber.value),
    onBlockPlayer: state.onBlockPlayer,
    onBlockVotes: state.onBlockVotes,
    nominatedPlayer: state.nominatedPlayer,
    nominatorPlayer: state.nominatorPlayer,
    audioCmd: state.audioCmd,
    gameResult: state.gameResult
  };
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
  renderPlayers();
}

// Send an audio command to the display. Nonce makes each press distinct so the
// display fires it exactly once (state is rebroadcast on every update).
let audioNonce = 0;
function sendAudioCommand(action) {
  state.audioCmd = { action, nonce: ++audioNonce };
  sendUpdate();
}

// Declare the game's winner — the display shows a full-screen victory banner.
// Nonce-gated like audio so each press triggers the banner exactly once.
let resultNonce = 0;
function declareWinner(winner) {
  state.gameResult = { winner, nonce: ++resultNonce };
  sendUpdate();
}

// Clear all day-scoped state: block, nomination, and per-player nominate flags
function clearDayState() {
  state.onBlockPlayer = null;
  state.onBlockVotes = 0;
  state.nominatedPlayer = null;
  state.nominatorPlayer = null;
  state.players.forEach(p => { p.hasNominated = false; p.hasBeenNominated = false; });
  nominatingPlayer = null;
}

// Mint a stable, unique player id. Names are editable, so id (not name) is the
// identity used by the lobby, the display's transient FX maps, and join chimes.
function newPlayerId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

// Deterministic avatar color + initials from a name (mirrors the display)
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `hsl(${h}, 45%, 42%)`;
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// Minimum votes needed to put someone on the block: half the living players,
// rounded up (a simple majority). This is the default and the floor for the picker.
function minVotesNeeded() {
  const alive = state.players.filter(p => p.alive).length;
  return Math.ceil(alive / 2);
}

// A [- value +] vote stepper, clamped to [min, max]. `onChange(value)` fires on
// each tap. Returns the container element. The number display updates in place.
function buildVoteStepper(initial, min, max, onChange) {
  let value = Math.min(Math.max(initial, min), max);
  const wrap = document.createElement("div");
  wrap.className = "vote-stepper";

  const dec = document.createElement("button");
  dec.className = "btn vote-step-btn";
  dec.textContent = "−";

  const display = document.createElement("span");
  display.className = "vote-step-value";

  const inc = document.createElement("button");
  inc.className = "btn vote-step-btn";
  inc.textContent = "+";

  const refresh = () => {
    display.textContent = value;
    dec.disabled = value <= min;
    inc.disabled = value >= max;
  };
  const set = (v) => {
    value = Math.min(Math.max(v, min), max);
    refresh();
    onChange(value);
  };
  dec.onclick = (e) => { e.stopPropagation(); set(value - 1); };
  inc.onclick = (e) => { e.stopPropagation(); set(value + 1); };

  wrap.appendChild(dec);
  wrap.appendChild(display);
  wrap.appendChild(inc);
  refresh();
  return wrap;
}



function renderPlayers() {
  // Match display theme: green by day, dark by night
  document.body.classList.toggle('day-theme', phaseSelect.value === 'Day');
  playersContainer.innerHTML = "";
  state.players.forEach((p, index) => {
    const isSelected = selectedPlayer === index;
    const card = document.createElement("div");
    card.className = `player-card ${!p.alive ? 'dead' : ''} ${state.onBlockPlayer === index ? 'on-block' : ''} ${state.nominatedPlayer === index ? 'nominated' : ''} ${isSelected ? 'selected' : ''}`;
    card.dataset.index = index;

    // Click card to select/deselect (reveals action buttons).
    // Ignore clicks on interactive children so dropdowns/inputs don't collapse the card.
    card.onclick = (e) => {
      if (e.target.closest('button, select, input, label, option')) return;
      selectedPlayer = isSelected ? null : index;
      if (!isSelected) nominatingPlayer = null;
      renderPlayers();
    };

    // Drag-to-reorder
    card.draggable = true;
    card.ondragstart = (e) => { dragIndex = index; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
    card.ondragend = () => { dragIndex = null; renderPlayers(); };
    card.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (dragIndex !== index) card.classList.add('drag-over'); };
    card.ondragleave = () => card.classList.remove('drag-over');
    card.ondrop = (e) => { e.preventDefault(); card.classList.remove('drag-over'); reorderPlayer(dragIndex, index); };

    // Drag handle hint
    const dragHandle = document.createElement("div");
    dragHandle.className = "drag-handle";
    dragHandle.innerHTML = "⠿";
    card.appendChild(dragHandle);

    // Add order controls
    const orderControls = document.createElement("div");
    orderControls.className = "order-controls";

    const moveUpBtn = document.createElement("button");
    moveUpBtn.className = "order-btn";
    moveUpBtn.innerHTML = "↑";
    moveUpBtn.disabled = index === 0;
    moveUpBtn.onclick = (e) => { e.stopPropagation(); movePlayer(index, -1); };

    const moveDownBtn = document.createElement("button");
    moveDownBtn.className = "order-btn";
    moveDownBtn.innerHTML = "↓";
    moveDownBtn.disabled = index === state.players.length - 1;
    moveDownBtn.onclick = (e) => { e.stopPropagation(); movePlayer(index, 1); };

    orderControls.appendChild(moveUpBtn);
    orderControls.appendChild(moveDownBtn);
    card.appendChild(orderControls);

    const header = document.createElement("div");
    header.className = "player-header";

    const avatar = document.createElement("div");
    avatar.className = "player-avatar";
    // Self-signed-up players may carry a photo; else the two-letter emblem.
    if (p.avatar) {
      avatar.style.backgroundImage = `url(${p.avatar})`;
      avatar.style.backgroundSize = 'cover';
      avatar.style.backgroundPosition = 'center';
    } else {
      avatar.textContent = initials(p.name);
      avatar.style.background = avatarColor(p.name);
    }

    const nameWrap = document.createElement("div");
    const nameDiv = document.createElement("div");
    nameDiv.className = "player-name";
    nameDiv.textContent = p.name;
    nameWrap.appendChild(nameDiv);
    if (p.pronouns) {
      const pron = document.createElement("div");
      pron.className = "player-pronouns";
      pron.textContent = p.pronouns;
      nameWrap.appendChild(pron);
    }

    header.appendChild(avatar);
    header.appendChild(nameWrap);

    const statusDiv = document.createElement("div");
    statusDiv.className = "player-status";

    const aliveBadge = document.createElement("div");
    if (p.alive) {
      aliveBadge.className = "status-badge alive";
      aliveBadge.innerHTML = '🕯️ Alive';
    } else if (p.deathCause === 'executed') {
      aliveBadge.className = "status-badge executed";
      aliveBadge.innerHTML = '⚖️ Executed';
    } else if (p.deathCause === 'killed') {
      aliveBadge.className = "status-badge killed";
      aliveBadge.innerHTML = '🔪 Killed';
    } else {
      aliveBadge.className = "status-badge dead";
      aliveBadge.innerHTML = '💀 Dead';
    }
    statusDiv.appendChild(aliveBadge);

    if (p.traveler) {
      const travelerBadge = document.createElement("div");
      travelerBadge.className = "status-badge traveler";
      travelerBadge.innerHTML = '🎒 Traveler';
      statusDiv.appendChild(travelerBadge);
    }

    if (p.ghostVote && !p.alive) {
      const ghostBadge = document.createElement("div");
      ghostBadge.className = "status-badge ghost";
      ghostBadge.innerHTML = '👻 Ghost Vote';
      statusDiv.appendChild(ghostBadge);
    }

    if (p.hasNominated) {
      const nomBadge = document.createElement("div");
      nomBadge.className = "status-badge nominator";
      nomBadge.innerHTML = '🕐 Nominator';
      statusDiv.appendChild(nomBadge);
    }

    if (p.hasBeenNominated) {
      const nomBadge = document.createElement("div");
      nomBadge.className = "status-badge nominee";
      nomBadge.innerHTML = '☠️ Nominee';
      statusDiv.appendChild(nomBadge);
    }

    card.appendChild(header);
    card.appendChild(statusDiv);

    // Buttons only shown when player selected
    if (!isSelected) {
      const hint = document.createElement("div");
      hint.className = "select-hint";
      hint.textContent = "Click to manage";
      card.appendChild(hint);
      playersContainer.appendChild(card);
      return;
    }

    const actionsDiv = document.createElement("div");
    actionsDiv.className = "player-actions";

    const isDay = phaseSelect.value === 'Day';
    const mkRow = () => { const r = document.createElement("div"); r.className = "action-row"; return r; };

    // Row 1: Execute & Kill (alive) / Revive (dead)
    const row1 = mkRow();
    if (p.alive) {
      // Two distinct death causes
      const executeBtn = document.createElement("button");
      executeBtn.className = "btn execute";
      executeBtn.textContent = "Execute";
      executeBtn.onclick = (e) => { e.stopPropagation(); killPlayer(index, 'executed'); };
      row1.appendChild(executeBtn);

      const killBtn = document.createElement("button");
      killBtn.className = "btn kill";
      killBtn.textContent = "Kill";
      killBtn.onclick = (e) => { e.stopPropagation(); killPlayer(index, 'killed'); };
      row1.appendChild(killBtn);
    } else {
      const reviveBtn = document.createElement("button");
      reviveBtn.className = "btn";
      reviveBtn.textContent = "Revive";
      reviveBtn.onclick = (e) => { e.stopPropagation(); revivePlayer(index); };
      row1.appendChild(reviveBtn);
    }
    actionsDiv.appendChild(row1);

    // Row 2: Nominate & Put on Block — only apply during the day
    if (isDay) {
      const row2 = mkRow();
      const nominateBtn = document.createElement("button");
      nominateBtn.className = "btn";
      nominateBtn.textContent = (state.nominatedPlayer === index) ? "Un-Nom" : "Nom";
      nominateBtn.onclick = (e) => {
        e.stopPropagation();
        if (state.nominatedPlayer === index) {
          clearNomination();
        } else {
          const opening = nominatingPlayer !== index;
          nominatingPlayer = opening ? index : null;
          renderPlayers();
          // Open the dropdown synchronously, still inside this click's user
          // gesture (mobile blocks showPicker/focus from async callbacks).
          if (opening) {
            const sel = document.getElementById("nominatorSelect");
            if (sel) {
              sel.focus();
              if (sel.showPicker) { try { sel.showPicker(); } catch (err) {} }
            }
          }
        }
      };
      row2.appendChild(nominateBtn);

      const onBlockBtn = document.createElement("button");
      onBlockBtn.className = "btn";
      onBlockBtn.textContent = (state.onBlockPlayer === index) ? "Un-Block" : "Block";
      onBlockBtn.onclick = (e) => {
        e.stopPropagation();
        if (state.onBlockPlayer === index) {
          toggleOnBlock(index); // removing — no picker needed
        } else {
          blockingPlayer = (blockingPlayer === index) ? null : index;
          nominatingPlayer = null;
          renderPlayers();
        }
      };
      row2.appendChild(onBlockBtn);
      actionsDiv.appendChild(row2);
    }

    // Row 3: Remove Ghost (dead only) & Set Traveler
    const row3 = mkRow();
    if (!p.alive) {
      const ghostBtn = document.createElement("button");
      ghostBtn.className = "btn";
      ghostBtn.textContent = p.ghostVote ? "Remove Ghost" : "Add Ghost";
      ghostBtn.onclick = (e) => { e.stopPropagation(); p.ghostVote = !p.ghostVote; sendUpdate(); };
      row3.appendChild(ghostBtn);
    }

    const travelerBtn = document.createElement("button");
    travelerBtn.className = "btn";
    travelerBtn.textContent = p.traveler ? "Unset Traveler" : "Set Traveler";
    travelerBtn.onclick = (e) => { e.stopPropagation(); p.traveler = !p.traveler; sendUpdate(); };
    row3.appendChild(travelerBtn);
    actionsDiv.appendChild(row3);

    // Row 4: Remove Player
    const row4 = mkRow();
    const removeBtn = document.createElement("button");
    removeBtn.className = "btn danger";
    removeBtn.textContent = "Remove Player";
    removeBtn.onclick = (e) => { e.stopPropagation(); removePlayer(index); };
    row4.appendChild(removeBtn);
    actionsDiv.appendChild(row4);

    card.appendChild(actionsDiv);

    // Nominate panel: pick the nominator (incl. self)
    if (nominatingPlayer === index) {
      const panel = document.createElement("div");
      panel.className = "nominate-panel";

      const label = document.createElement("label");
      label.textContent = `Who nominates ${p.name}?`;
      panel.appendChild(label);

      const select = document.createElement("select");
      select.id = "nominatorSelect";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Select nominator...";
      select.appendChild(placeholder);
      state.players.forEach((np, ni) => {
        // A player can only nominate once per day
        if (np.hasNominated && ni !== state.nominatorPlayer) return;
        const opt = document.createElement("option");
        opt.value = ni;
        opt.textContent = ni === index ? `${np.name} (self)` : np.name;
        select.appendChild(opt);
      });
      panel.appendChild(select);

      const buttons = document.createElement("div");
      buttons.className = "nominate-panel-buttons";

      const confirmBtn = document.createElement("button");
      confirmBtn.className = "btn btn-primary";
      confirmBtn.textContent = "Confirm";
      confirmBtn.onclick = (e) => {
        e.stopPropagation();
        if (select.value === "") return;
        setNomination(parseInt(select.value), index);
      };
      buttons.appendChild(confirmBtn);

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "btn";
      cancelBtn.textContent = "Cancel";
      cancelBtn.onclick = (e) => { e.stopPropagation(); nominatingPlayer = null; renderPlayers(); };
      buttons.appendChild(cancelBtn);

      panel.appendChild(buttons);
      card.appendChild(panel);
    }

    // Put-on-block vote picker: choose vote count before confirming
    if (blockingPlayer === index) {
      const panel = document.createElement("div");
      panel.className = "nominate-panel";

      const label = document.createElement("label");
      label.textContent = `Votes to put ${p.name} on the block:`;
      panel.appendChild(label);

      // Stepper: defaults to the min needed, range [0, total players].
      const min = 0;
      const max = state.players.length;
      let votes = Math.min(minVotesNeeded(), max);
      const stepper = buildVoteStepper(votes, min, max, (v) => { votes = v; });
      panel.appendChild(stepper);

      const buttons = document.createElement("div");
      buttons.className = "nominate-panel-buttons";

      const confirmBtn = document.createElement("button");
      confirmBtn.className = "btn btn-primary";
      confirmBtn.textContent = "Confirm";
      confirmBtn.onclick = (e) => {
        e.stopPropagation();
        setOnBlock(index, votes);
      };
      buttons.appendChild(confirmBtn);

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "btn";
      cancelBtn.textContent = "Cancel";
      cancelBtn.onclick = (e) => { e.stopPropagation(); blockingPlayer = null; renderPlayers(); };
      buttons.appendChild(cancelBtn);

      panel.appendChild(buttons);
      card.appendChild(panel);
    }

    // Add on-block controls if this player is on the block
    if (state.onBlockPlayer === index) {
      const onBlockControls = document.createElement("div");
      onBlockControls.className = "on-block-controls";
      
      const onBlockTitle = document.createElement("div");
      onBlockTitle.className = "on-block-title";
      onBlockTitle.textContent = "🗡️ On the Block";
      onBlockControls.appendChild(onBlockTitle);
      
      const votesGroup = document.createElement("div");
      votesGroup.className = "votes-input-group";

      const votesLabel = document.createElement("label");
      votesLabel.textContent = "Votes:";
      votesGroup.appendChild(votesLabel);

      // Live edit of the on-block count, range [0, total players].
      const stepper = buildVoteStepper(state.onBlockVotes || 0, 0, state.players.length,
        (v) => updateOnBlockVotes(v));
      votesGroup.appendChild(stepper);

      onBlockControls.appendChild(votesGroup);
      card.appendChild(onBlockControls);
    }
    
    playersContainer.appendChild(card);
  });
}

function toggleOnBlock(index) {
  if (state.onBlockPlayer === index) {
    state.onBlockPlayer = null;
    state.onBlockVotes = 0;
  } else {
    state.onBlockPlayer = index;
    state.onBlockVotes = 0;
    // Putting someone on the block ends the active nomination, but the
    // nominator/nominee badges persist for the rest of the day.
    state.nominatorPlayer = null;
    state.nominatedPlayer = null;
  }
  sendUpdate();
}

// Confirm putting a player on the block with a chosen vote count
function setOnBlock(index, votes) {
  state.onBlockPlayer = index;
  state.onBlockVotes = votes;
  blockingPlayer = null;
  // Putting someone on the block ends the active nomination; sticky badges stay.
  state.nominatorPlayer = null;
  state.nominatedPlayer = null;
  sendUpdate();
}

function updateOnBlockVotes(votes) {
  state.onBlockVotes = votes;
  sendUpdate();
}

// Set a nomination: nominator -> nominee. The active highlight moves to this pair,
// but per-player nominator/nominee badges accumulate and persist until the next day.
function setNomination(nominatorIndex, nomineeIndex) {
  state.nominatorPlayer = nominatorIndex;
  state.nominatedPlayer = nomineeIndex;
  state.players[nominatorIndex].hasNominated = true;
  state.players[nomineeIndex].hasBeenNominated = true;
  nominatingPlayer = null;
  sendUpdate();
}

// Clear the current active nomination (the highlighted pair). Also clears that pair's
// sticky badges — this is the explicit "Un-nominate" undo.
function clearNomination(send = true) {
  if (state.nominatorPlayer !== null && state.players[state.nominatorPlayer]) {
    state.players[state.nominatorPlayer].hasNominated = false;
  }
  if (state.nominatedPlayer !== null && state.players[state.nominatedPlayer]) {
    state.players[state.nominatedPlayer].hasBeenNominated = false;
  }
  state.nominatorPlayer = null;
  state.nominatedPlayer = null;
  if (send) sendUpdate();
}

function killPlayer(index, cause) {
  const player = state.players[index];
  player.alive = false;
  player.deathCause = cause; // 'executed' or 'killed'
  // Executing the player on the block clears the block.
  if (state.onBlockPlayer === index) {
    state.onBlockPlayer = null;
    state.onBlockVotes = 0;
  }
  // An execution ends the day's nomination phase: clear the active pair and
  // wipe every player's sticky nominator/nominee badges.
  if (cause === 'executed') {
    state.nominatorPlayer = null;
    state.nominatedPlayer = null;
    state.players.forEach(pl => { pl.hasNominated = false; pl.hasBeenNominated = false; });
  }
  sendUpdate();
}

function revivePlayer(index) {
  const player = state.players[index];
  player.alive = true;
  player.deathCause = null;
  sendUpdate();
}

function movePlayer(index, direction) {
  const newIndex = index + direction;

  // Check bounds
  if (newIndex < 0 || newIndex >= state.players.length) {
    return;
  }

  reorderPlayer(index, newIndex);
}

// Move player from `from` index to `to` index, shifting tracked indices to follow.
function reorderPlayer(from, to) {
  if (from === null || to === null || from === to) return;
  if (from < 0 || to < 0 || from >= state.players.length || to >= state.players.length) return;

  const remap = (i) => {
    if (i === null) return null;
    if (i === from) return to;
    // Index shifts when an element is pulled out and reinserted
    if (from < to) return (i > from && i <= to) ? i - 1 : i;
    return (i >= to && i < from) ? i + 1 : i;
  };

  const [moved] = state.players.splice(from, 1);
  state.players.splice(to, 0, moved);

  state.onBlockPlayer = remap(state.onBlockPlayer);
  state.nominatedPlayer = remap(state.nominatedPlayer);
  state.nominatorPlayer = remap(state.nominatorPlayer);
  if (selectedPlayer !== null) selectedPlayer = remap(selectedPlayer);
  if (nominatingPlayer !== null) nominatingPlayer = remap(nominatingPlayer);

  sendUpdate();
}

function removePlayer(index) {
  if (!confirm(`Remove ${state.players[index].name}?`)) {
    return;
  }
  
  // Adjust tracked indices if necessary
  if (state.onBlockPlayer === index) {
    state.onBlockPlayer = null;
    state.onBlockVotes = 0;
  } else if (state.onBlockPlayer !== null && state.onBlockPlayer > index) {
    state.onBlockPlayer--;
  }

  if (state.nominatedPlayer === index) {
    state.nominatedPlayer = null;
  } else if (state.nominatedPlayer !== null && state.nominatedPlayer > index) {
    state.nominatedPlayer--;
  }

  if (state.nominatorPlayer === index) {
    state.nominatorPlayer = null;
  } else if (state.nominatorPlayer !== null && state.nominatorPlayer > index) {
    state.nominatorPlayer--;
  }

  // Clear selection/nominate UI tied to this card
  selectedPlayer = null;
  nominatingPlayer = null;

  // Remove player from array
  state.players.splice(index, 1);

  sendUpdate();
}

function nextPhase() {
  // Normal phase advancement
  if (phaseSelect.value === 'Night') {
    phaseSelect.value = 'Day';
  } else {
    phaseSelect.value = 'Night';
    phaseNumber.value = String(Number(phaseNumber.value) + 1);
    // Clear nominated and on-block when transitioning to Night
    clearDayState();
  }
  sendUpdate();
}

// Initialize event listeners
phaseSelect.onchange = () => {
  // Clear nominated and on-block when transitioning to Night
  if (phaseSelect.value === 'Night' && previousPhase === 'Day') {
    clearDayState();
  }
  previousPhase = phaseSelect.value;
  sendUpdate();
};
phaseNumber.onchange = sendUpdate;
nextPhaseBtn.onclick = nextPhase;

function bulkImportPlayers() {
  const input = bulkPlayerInput.value.trim();
  if (!input) return;
  
  // Split by newlines or commas
  const names = input.split(/[\n,]+/).map(name => name.trim()).filter(name => name);
  
  if (names.length === 0) return;
  
  // Add players
  names.forEach(name => {
    // Check if player already exists
    if (!state.players.find(p => p.name.toLowerCase() === name.toLowerCase())) {
      state.players.push({ id: newPlayerId(), name, alive: true, traveler: false, ghostVote: true });
    }
  });
  
  sendUpdate();
  bulkPlayerInput.value = "";
}

function clearBulkInput() {
  bulkPlayerInput.value = "";
}

addPlayerBtn.onclick = () => {
  const name = newPlayerName.value.trim();
  if (name) {
    state.players.push({ id: newPlayerId(), name, alive: true, traveler: false, ghostVote: true });
    sendUpdate();
    newPlayerName.value = "";
  }
};

bulkImportBtn.onclick = bulkImportPlayers;
clearBulkBtn.onclick = clearBulkInput;

nextPhaseBtn.onclick = nextPhase;

phaseSelect.addEventListener("change", sendUpdate);
phaseNumber.addEventListener("input", sendUpdate);

document.getElementById("audioChangeBtn").onclick = () => sendAudioCommand('change');
document.getElementById("audioRestartBtn").onclick = () => sendAudioCommand('restart');
document.getElementById("audioFadeBtn").onclick = () => sendAudioCommand('fade');
document.getElementById("audioStopBtn").onclick = () => sendAudioCommand('stop');

document.getElementById("goodWinsBtn").onclick = () => declareWinner('good');
document.getElementById("evilWinsBtn").onclick = () => declareWinner('evil');

// Start a new game: server clears the roster + mints a new gameId, which frees
// every phone to re-join the lobby.
document.getElementById("newGameBtn").onclick = () => {
  if (!confirm('Start a new game? This clears all players and lets everyone re-join the lobby.')) return;
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ newGame: true }));
  }
};

renderPlayers();
</script>
</body>
</html>
